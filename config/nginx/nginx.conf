# =============================================================================
# 7Gather - Nginx Reverse Proxy Configuration (Traditional Deployment)
# =============================================================================
# This is a standalone nginx.conf template for deployments that do NOT use
# jc21/nginx-proxy-manager. For Nginx Proxy Manager (docker-compose default),
# see the README.md in this directory.
#
# Environment variables (replace before use or use envsubst):
#   ${DOMAIN}             - Your domain (e.g., gather.example.com)
#   ${SSL_CERT_PATH}      - Path to fullchain.pem
#   ${SSL_KEY_PATH}       - Path to privkey.pem
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # ==========================================================================
    # Upstream definitions
    # ==========================================================================

    upstream colyseus {
        server colyseus:2567;
    }

    upstream livekit {
        server livekit:7880;
    }

    upstream client {
        server client:80;
    }

    # ==========================================================================
    # HTTP → HTTPS Redirect
    # ==========================================================================

    server {
        listen 80;
        listen [::]:80;
        server_name ${DOMAIN};

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # HTTPS Server
    # ==========================================================================

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ${DOMAIN};

        # ------------------------------------------------------------------
        # TLS Configuration
        # ------------------------------------------------------------------
        ssl_certificate     ${SSL_CERT_PATH};
        ssl_certificate_key ${SSL_KEY_PATH};

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS (optional, uncomment for production)
        # add_header Strict-Transport-Security "max-age=63072000" always;

        # ------------------------------------------------------------------
        # WebSocket proxy for Colyseus (State Server) on /colyseus
        # ------------------------------------------------------------------
        location /colyseus/ {
            proxy_pass http://colyseus/;

            # WebSocket upgrade headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout ≥300s to keep WebSocket connections alive
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Preserve client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for real-time communication
            proxy_buffering off;
        }

        # ------------------------------------------------------------------
        # Colyseus API routes (health, rooms)
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass http://colyseus/;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # WebSocket proxy for LiveKit (Media Server) on /livekit
        # ------------------------------------------------------------------
        location /livekit/ {
            proxy_pass http://livekit/;

            # WebSocket upgrade headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout ≥300s for long-running media sessions
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Preserve client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for real-time communication
            proxy_buffering off;
        }

        # ------------------------------------------------------------------
        # Client SPA (frontend)
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://client;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SPA fallback - try files first, then proxy
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
